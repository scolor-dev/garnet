[workspace]
resolver = "3"
members = [
    "crates/app",
    "crates/runtime",
    "crates/ui",
    "crates/renderer",
    "crates/source",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["scolor-dev"]

[workspace.dependencies]
anyhow = "1.0"
eframe = "0.35.0"
egui = "0.35.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
thiserror = "2.0"
